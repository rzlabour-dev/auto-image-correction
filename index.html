<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auto Image Correction Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- External CSS -->
  <link rel="stylesheet" href="style-icp.css">

  <!-- Page CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 { text-align: center; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .drop-zone {
      border: 2px dashed #00a3c4;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .drop-zone.hover {
      background: #e6f7fb;
    }

    .tools-section {
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #eee;
      border-radius: 6px;
    }

    .tools-section h3 {
      margin-top: 0;
      font-size: 16px;
      color: #007bff;
    }

    label {
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 5px;
      margin-bottom: 8px;
    }

    button {
      padding: 8px 12px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 4px 0;
      width: 100%;
    }

    button:hover {
      background: #0056b3;
    }

    canvas {
      display: block;
      margin: 10px auto;
      border: 1px solid #ccc;
      background: #fff;
    }

    .preview-panel {
      text-align: center;
    }

    .status {
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>Auto Image Correction</h1>
  <p style="text-align:center;">Resize • Crop • Rotate • Compress • Background Fill</p>

  <div class="layout">

    <!-- LEFT PANEL -->
    <div>

      <!-- Upload -->
      <div id="dropZone" class="drop-zone">
        <p><strong>Drag & Drop Image</strong><br>or Click to Upload</p>
        <input type="file" id="upload" accept="image/*" hidden>
      </div>

      <!-- Resize -->
      <div class="tools-section">
        <h3>Resize</h3>
        <label>Width</label>
        <input type="number" id="w" value="300">
        <label>Height</label>
        <input type="number" id="h" value="400">
        <button onclick="resizeImage()">Resize</button>
      </div>

      <!-- Crop -->
      <div class="tools-section">
        <h3>Crop & Face</h3>
        <button onclick="applyCrop()">Apply Crop</button>
        <button onclick="passportAutoCrop()">Passport Auto Crop</button>
        <button onclick="drawFaceGuides()">Face Guide</button>
        <button onclick="checkICPRules()">ICP Check</button>
      </div>

      <!-- Rotate -->
      <div class="tools-section">
        <h3>Rotate & Background</h3>
        <label>Rotate (degrees)</label>
        <input type="number" id="rotate" value="0">
        <button onclick="rotateImage()">Rotate</button>
        <button onclick="whiteBackground()">White Background</button>
        <button onclick="resetCanvas()">Reset</button>
      </div>

      <!-- Download -->
      <div class="tools-section">
        <h3>Download</h3>
        <label>Quality</label>
        <select id="quality">
          <option value="0.9">High</option>
          <option value="0.7">Medium</option>
          <option value="0.5">Low</option>
        </select>
        <button onclick="downloadImage()">Compress & Download</button>
      </div>

    </div>

    <!-- RIGHT PANEL -->
    <div class="preview-panel">
      <h3>Main Preview</h3>
      <canvas id="canvas" width="300" height="400"></canvas>

      <h4>Passport Preview</h4>
      <canvas id="preview" width="150" height="200"></canvas>

      <div id="status" class="status"></div>
    </div>

  </div>
</div>

<!-- CORE JS -->
<script>
  const upload = document.getElementById('upload');
  const dropZone = document.getElementById('dropZone');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let img = new Image();

  dropZone.onclick = () => upload.click();

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('hover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('hover');
  });

  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('hover');
    upload.files = e.dataTransfer.files;
    upload.dispatchEvent(new Event('change'));
  });

  upload.addEventListener('change', () => {
    const file = upload.files[0];
    if (!file) return;

    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      setStatus("Image loaded successfully");
    };
    img.src = URL.createObjectURL(file);
  });

  function setStatus(msg) {
    document.getElementById('status').innerText = msg;
  }
</script>

<!-- MODULE SCRIPTS (ORDER MATTERS) -->
<link rel="stylesheet" href="css/style-icp.css">


<script src="js/crop-advanced.js"></script>
<script src="js/icp-rules.js"></script>
<script src="js/icp-rules-check.js"></script>


</body>
</html>
