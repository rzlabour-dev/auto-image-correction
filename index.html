<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auto Image Correction Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; padding:20px; }
    .container { max-width:800px; margin:auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    h1 { text-align:center; }
    .tools { display:flex; flex-wrap:wrap; gap:10px; margin:15px 0; }
    input, select { margin:5px 0; }
    canvas { display:block; margin:15px auto; border:1px solid #ccc; background:#fff; }
    button { padding:8px 12px; background:#007bff; color:#fff; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#0056b3; }
    label { font-size:14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Auto Image Correction</h1>
    <p>Resize • Crop • Rotate • Compress • Background Fill</p>

    <input type="file" id="upload" accept="image/*" />

    <div class="tools">
      <label>Width: <input type="number" id="w" value="300"></label>
      <label>Height: <input type="number" id="h" value="400"></label>
      <button onclick="resizeImage()">Resize</button>
      <button onclick="applyCrop()">Apply Crop</button>
      <button onclick="drawFaceGuides()">Face Guide</button>



      <label>Rotate: <input type="number" id="rotate" value="0">°</label>
      <button onclick="rotateImage()">Rotate</button>

      <button onclick="passportAutoCrop()">Passport Auto Crop</button>

      <label>Quality:
        <select id="quality">
          <option value="0.9">High</option>
          <option value="0.7">Medium</option>
          <option value="0.5">Low</option>
        </select>
      </label>
      <button onclick="downloadImage()">Compress & Download</button>

      <button onclick="whiteBackground()">White Background</button>
      <button onclick="resetCanvas()">Reset</button>
    </div>

    <canvas id="canvas" width="300" height="400"></canvas>
    <!-- 🔹 Crop preview (passport ratio) -->
<canvas id="preview" width="150" height="200"
        style="border:1px solid #00a3c4; margin-top:10px;"></canvas>
  </div>

  <script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let img = new Image();

    upload.addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
      };
      img.src = URL.createObjectURL(file);
    });

    function resizeImage() {
      const w = document.getElementById('w').value;
      const h = document.getElementById('h').value;
      const temp = document.createElement('canvas');
      temp.width = w;
      temp.height = h;
      temp.getContext('2d').drawImage(canvas, 0, 0, w, h);
      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(temp, 0, 0);
    }

    function rotateImage() {
      const angle = document.getElementById('rotate').value * Math.PI / 180;
      const temp = document.createElement('canvas');
      temp.width = canvas.width;
      temp.height = canvas.height;
      const tctx = temp.getContext('2d');
      tctx.translate(canvas.width/2, canvas.height/2);
      tctx.rotate(angle);
      tctx.drawImage(canvas, -canvas.width/2, -canvas.height/2);
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(temp,0,0);
    }

    function whiteBackground() {
      ctx.globalCompositeOperation = 'destination-over';
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.globalCompositeOperation = 'source-over';
    }

    function resetCanvas() {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img,0,0);
    }

    function downloadImage() {
      const q = document.getElementById('quality').value;
      const link = document.createElement('a');
      link.download = 'corrected-image.jpg';
      link.href = canvas.toDataURL('image/jpeg', q);
      link.click();
    }
  </script>
  <script src="crop-tool.js"></script>
  <link rel="stylesheet" href="style-icp.css">
<script src="crop-advanced.js"></script>
<script src="icp-rules.js"></script>
</body>
</html>
