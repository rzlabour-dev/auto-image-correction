<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auto Image Correction Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; padding:20px; }
    .container { max-width:600px; margin:auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    h1 { text-align:center; }
    input { margin:10px 0; }
    canvas { display:block; margin:15px auto; border:1px solid #ccc; }
    button { padding:10px 15px; background:#007bff; color:#fff; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#0056b3; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Auto Image Correction</h1>
    <p>Passport / MOHRE-style basic image correction</p>

    <input type="file" id="upload" accept="image/*" />
    <canvas id="canvas" width="300" height="400"></canvas>
    <button onclick="downloadImage()">Download Corrected Image</button>
  </div>

  <script>
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    upload.addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = function () {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Auto resize to 300x400
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      };
      img.src = URL.createObjectURL(file);
    });

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'corrected-image.jpg';
      link.href = canvas.toDataURL('image/jpeg', 0.85); // compression
      link.click();
    }
  </script>
</body>
</html>
